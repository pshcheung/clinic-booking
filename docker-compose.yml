version: '3.9'

services:
  mysql:
    image: mysql:latest
    ports:
      - 3306:3306
    restart: unless-stopped
    environment:
      # The user, password and database that Keycloak
      # is going to create and use
      MYSQL_USER: keycloak_user
      MYSQL_PASSWORD: keycloak_password
      MYSQL_DATABASE: keycloak_db
      # Self-Explanatory
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - keycloak-and-mysql-volume:/var/lib/mysql
      - ./configs/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - keycloak-and-mysql-network

  keycloak:
    image: jboss/keycloak:16.1.1
    ports:
      - 8080:8080
    restart: unless-stopped
    volumes:
      - ./configs/keycloak:/tmp/import
    command:
      - "-Dkeycloak.migration.action=import"
      - "-Dkeycloak.migration.provider=dir"
      - "-Dkeycloak.migration.dir=/tmp/import"
    environment:
      # KEYCLOAK_IMPORT: ./configs/keycloak/clinic-booking-realm.json
      # KEYCLOAK_IMPORT: ./configs/keycloak/clinic-booking-realm.json -Dkeycloak.profile.feature.upload_scripts=enabled
      # User and password for the Administration Console
      KEYCLOAK_USER: admin_user
      KEYCLOAK_PASSWORD: admin_password
      DB_VENDOR: mysql
      DB_ADDR: mysql
      DB_PORT: 3306
      # Same values as the mysql-kc service
      DB_USER: keycloak_user
      DB_PASSWORD: keycloak_password
      DB_DATABASE: keycloak_db
    depends_on:
      - mysql
    networks:
      - keycloak-and-mysql-network

  service:
    build:
      context: ./etracker-service
      dockerfile: ./Dockerfile.spring
    container_name: et-service
    ports:
      - 9090:9090
    networks:
      - keycloak-and-mysql-network
    depends_on:
      - mysql
      - keycloak
    restart: always

  ui:
    build:
      context: ./etracker-ui
      dockerfile: ./Dockerfile.angular
    container_name: et-ui
    networks:
      - keycloak-and-mysql-network
    depends_on:
      - service
    ports:
      - 80:80

networks:
  keycloak-and-mysql-network:

volumes:
  keycloak-and-mysql-volume: