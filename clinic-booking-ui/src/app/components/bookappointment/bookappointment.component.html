<app-header></app-header>

<div class="message" id="messagecard"><b>{{ message }}</b></div>

<div class="container" id="appointmentform">
  <h2 class="textual" style="color: darkgreen"><i class="fa fa-calendar"></i><b> Book Your New appointments </b></h2>
  <small style="color:maroon; font-weight: bold; margin-left: 15%;"> Please check doctor's availability before booking
    your respective slot</small>
  <form #bookappointmentform="ngForm" (ngSubmit)="bookAppointment()">

    <div class="form-group">
      <label for="patientname">Patient Name : <b class="text-danger">*</b><small style="color: gray; font-size: 12px;">
        (please enter full name of the patient with initial)</small></label>
      <input #patientname="ngModel" [(ngModel)]="appointment.patientname" [class.is-invalid]="patientname.invalid && patientname.touched" class="form-control"
             name="patientname" placeholder="enter your name"
             required
             type="text">
      <small [class.d-none]="patientname.valid || patientname.untouched" class="text-danger"><b>required
        field</b></small>
    </div>

    <div class="form-group">
      <label for="patientemail"> Email address : <b class="text-danger">*</b><small
        style="color: gray; font-size: 12px;"> (please enter a valid email address)</small></label>
      <input #patientemail="ngModel" [(ngModel)]="appointment.email" [class.is-invalid]="patientemail.invalid && patientemail.touched" class="form-control"
             name="patientemail" pattern="^[a-zA-Z0-9+_.-]+@[a-zA-Z0-9.-]+$" placeholder="enter email address"
             required
             type="email">
      <div *ngIf="patientemail.errors && (patientemail.invalid && patientemail.touched)">
        <small *ngIf="patientemail.errors.required" class="text-danger"><b>required field</b></small>
        <small *ngIf="patientemail.errors.pattern" class="text-danger"><b>Invalid email Id</b></small>
      </div>
    </div>

    <div class="form-group">
      <label for="doctor">Choose Doctor : <b class="text-danger">* </b><small style="color: gray; font-size: 12px;">(choose
        from dropdown)</small></label>
      <select #doctor="ngModel" [(ngModel)]="appointment.doctorname" class="form-control" id="sel1"
              name="doctor">
        <option selected="true">select doctor</option>
        <option *ngFor="let doctor of doctors | async">{{ doctor }}</option>
      </select>
    </div>

    <div class="form-group">
      <label for="specialization">Specialization : <b class="text-danger">* </b><small
        style="color: gray; font-size: 12px;">(choose from dropdown)</small></label>
      <select #specialization="ngModel" [(ngModel)]="appointment.specialization" class="form-control" id="sel1"
              name="specialization">
        <option selected="true">select speciality</option>
        <option *ngFor="let speciality of specializations | async">{{ speciality }}</option>
      </select>
    </div>

    <div class="form-group">
      <label for="date">Appointment Date : <b class="text-danger">*</b><small style="color: gray; font-size: 12px;">
        (please choose proper date as per slot availability)</small></label>
      <input #date="ngModel" [(ngModel)]="appointment.date" [class.is-invalid]="date.invalid && date.touched" class="form-control"
             name="date" placeholder="choose appointment date"
             required
             type="date">
      <small [class.d-none]="date.valid || date.untouched" class="text-danger"><b>required field</b></small>
    </div>

    <div class="form-group">
      <label for="slot">Appointment Slot : <b class="text-danger">* </b><small style="color: gray; font-size: 12px;">(choose
        from dropdown)</small></label>
      <select #slot="ngModel" [(ngModel)]="appointment.slot" class="form-control" id="sel1"
              name="slot">
        <option>AM slot</option>
        <option>Noon slot</option>
        <option>PM slot</option>
      </select>
    </div>

    <div class="form-group">
      <label for="age">Patient Age : <b class="text-danger">*</b><small style="color: gray; font-size: 12px;"> (please
        enter proper age of the patient)</small></label>
      <input #age="ngModel" [(ngModel)]="appointment.age" [class.is-invalid]="age.invalid && age.touched" class="form-control" name="age"
             placeholder="enter your age"
             required
             type="text">
      <small [class.d-none]="age.valid || age.untouched" class="text-danger"><b>required field</b></small>
    </div>

    <div class="form-group">
      <label for="gender">Patient Gender : <b class="text-danger">* </b></label>
      <select #gender="ngModel" [(ngModel)]="appointment.gender" class="form-control" id="sel1"
              name="gender">
        <option>Male</option>
        <option>Female</option>
        <option>others</option>
      </select>
    </div>

    <div class="form-group">
      <label for="problem">Patient's Problem : <b class="text-danger">*</b></label>
      <input #problem="ngModel" [(ngModel)]="appointment.problem" [class.is-invalid]="problem.invalid && problem.touched" class="form-control"
             name="problem" placeholder="enter your problem"
             required
             type="text">
      <small [class.d-none]="problem.valid || problem.untouched" class="text-danger"><b>required field</b></small>
    </div>

    <button [disabled]="bookappointmentform.form.invalid" class="btn registerbtn" style="margin-top: 15px;"
            type="submit"><i class="fa fa-plus"></i>&nbsp; Book Your Appointment
    </button>
  </form>
</div>

<br><br>
<app-footer></app-footer>
